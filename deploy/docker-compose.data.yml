# Production volumes backed by the project data directory.
volumes:
  new-api-data:
    name: ${COMPOSE_PROJECT_NAME}_host_new-api-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PROJECT_DATA_DIR:?PROJECT_DATA_DIR is required}/new-api-data"
  new-api-logs:
    name: ${COMPOSE_PROJECT_NAME}_host_new-api-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PROJECT_DATA_DIR:?PROJECT_DATA_DIR is required}/new-api-logs"
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME}_host_mysql-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PROJECT_DATA_DIR:?PROJECT_DATA_DIR is required}/mysql-data"
  redis-data:
    name: ${COMPOSE_PROJECT_NAME}_host_redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PROJECT_DATA_DIR:?PROJECT_DATA_DIR is required}/redis-data"
